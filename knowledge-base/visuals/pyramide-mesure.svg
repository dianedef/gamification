<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">La pyramide de mesure</text>
  <text x="350" y="50" text-anchor="middle" font-size="13" fill="#64748b">Mesurez de bas en haut — les métriques d'activité alimentent le business</text>

  <!-- Level 5 (top) - ROI -->
  <polygon points="350,75 410,135 290,135" fill="#7c3aed" filter="url(#shadow)"/>
  <text x="350" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">ROI</text>

  <!-- Level 4 - Business Outcomes -->
  <polygon points="290,140 410,140 460,200 240,200" fill="#8b5cf6" filter="url(#shadow)"/>
  <text x="350" y="175" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Business Outcomes</text>

  <!-- Level 3 - Engagement -->
  <polygon points="240,205 460,205 510,265 190,265" fill="#a78bfa" filter="url(#shadow)"/>
  <text x="350" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Engagement Metrics</text>

  <!-- Level 2 - Gamification Metrics -->
  <polygon points="190,270 510,270 560,330 140,330" fill="#c4b5fd" filter="url(#shadow)"/>
  <text x="350" y="305" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">Gamification Metrics</text>

  <!-- Level 1 (base) - Activity Metrics -->
  <polygon points="140,335 560,335 610,395 90,395" fill="#ddd6fe" filter="url(#shadow)"/>
  <text x="350" y="370" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">Activity Metrics</text>

  <!-- Right side KPIs -->
  <!-- ROI -->
  <line x1="415" y1="110" x2="470" y2="110" stroke="#7c3aed" stroke-width="1"/>
  <text x="480" y="114" font-size="10" fill="#7c3aed">LTV, CAC, payback period</text>

  <!-- Business -->
  <line x1="465" y1="175" x2="490" y2="175" stroke="#8b5cf6" stroke-width="1"/>
  <text x="500" y="170" font-size="10" fill="#8b5cf6">Revenus, conversion,</text>
  <text x="500" y="183" font-size="10" fill="#8b5cf6">rétention D30, churn</text>

  <!-- Engagement -->
  <line x1="515" y1="240" x2="540" y2="240" stroke="#a78bfa" stroke-width="1"/>
  <text x="550" y="235" font-size="10" fill="#7c3aed">DAU/MAU, stickiness,</text>
  <text x="550" y="248" font-size="10" fill="#7c3aed">session duration, D1/D7</text>

  <!-- Gamification -->
  <line x1="565" y1="305" x2="590" y2="305" stroke="#c4b5fd" stroke-width="1"/>
  <text x="600" y="300" font-size="10" fill="#7c3aed">Badge earn rate, streak avg,</text>
  <text x="600" y="313" font-size="10" fill="#7c3aed">points velocity, feature adoption</text>

  <!-- Activity -->
  <line x1="615" y1="370" x2="640" y2="370" stroke="#ddd6fe" stroke-width="1"/>
  <text x="650" y="365" font-size="10" fill="#7c3aed">Actions, clics, vues,</text>
  <text x="650" y="378" font-size="10" fill="#7c3aed">check-ins, lectures</text>

  <!-- Arrow -->
  <line x1="70" y1="395" x2="70" y2="85" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowup)"/>
  <defs>
    <marker id="arrowup" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto">
      <polygon points="0 6, 4 0, 8 6" fill="#6366f1"/>
    </marker>
  </defs>
  <text x="60" y="250" text-anchor="middle" font-size="10" font-weight="600" fill="#6366f1" transform="rotate(-90, 60, 250)">Valeur stratégique</text>

  <!-- Bottom note -->
  <rect x="90" y="415" width="520" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="350" y="435" text-anchor="middle" font-size="11" fill="#475569">
    <tspan font-weight="600">Piège courant :</tspan> ne mesurer que le bas (activité, badges gagnés)
  </text>
  <text x="350" y="449" text-anchor="middle" font-size="11" fill="#475569">sans vérifier si ça impacte le haut (business, ROI)</text>

  <!-- Source -->
  <text x="350" y="478" text-anchor="middle" font-size="10" fill="#94a3b8">Source : KB-07 Métriques et analytics de la gamification</text>
</svg>