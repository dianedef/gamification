<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Le Hook Model</text>
  <text x="350" y="55" text-anchor="middle" font-size="13" fill="#64748b">Nir Eyal — Créer des habitudes en 4 phases</text>

  <!-- Central cycle text -->
  <text x="350" y="265" text-anchor="middle" font-size="11" fill="#94a3b8">Chaque cycle</text>
  <text x="350" y="280" text-anchor="middle" font-size="11" fill="#94a3b8">renforce le suivant</text>

  <!-- 1. TRIGGER (top left) -->
  <rect x="80" y="90" width="180" height="100" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
  <text x="170" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#4338ca">1. TRIGGER</text>
  <text x="170" y="118" text-anchor="middle" font-size="24" dy="-20" fill="#6366f1">⚡</text>
  <text x="170" y="140" text-anchor="middle" font-size="11" fill="#6366f1">Déclencheur</text>
  <text x="170" y="158" text-anchor="middle" font-size="10" fill="#818cf8">Externe → Interne</text>
  <text x="170" y="174" text-anchor="middle" font-size="9" fill="#a5b4fc">Push, email, ennui, anxiété</text>

  <!-- 2. ACTION (top right) -->
  <rect x="440" y="90" width="180" height="100" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="530" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">2. ACTION</text>
  <text x="530" y="118" text-anchor="middle" font-size="24" dy="-20" fill="#10b981">👆</text>
  <text x="530" y="140" text-anchor="middle" font-size="11" fill="#10b981">Comportement</text>
  <text x="530" y="158" text-anchor="middle" font-size="10" fill="#34d399">B = MAP (Fogg)</text>
  <text x="530" y="174" text-anchor="middle" font-size="9" fill="#6ee7b7">Motivation × Capacité × Prompt</text>

  <!-- 3. VARIABLE REWARD (bottom right) -->
  <rect x="440" y="310" width="180" height="100" rx="12" fill="#fefce8" stroke="#eab308" stroke-width="2" filter="url(#shadow)"/>
  <text x="530" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#854d0e">3. RÉCOMPENSE</text>
  <text x="530" y="338" text-anchor="middle" font-size="24" dy="-20" fill="#eab308">🎁</text>
  <text x="530" y="360" text-anchor="middle" font-size="11" fill="#ca8a04">Variable</text>
  <text x="530" y="378" text-anchor="middle" font-size="10" fill="#eab308">Tribu / Chasse / Soi</text>
  <text x="530" y="394" text-anchor="middle" font-size="9" fill="#fbbf24">Surprise, découverte, maîtrise</text>

  <!-- 4. INVESTMENT (bottom left) -->
  <rect x="80" y="310" width="180" height="100" rx="12" fill="#fdf2f8" stroke="#ec4899" stroke-width="2" filter="url(#shadow)"/>
  <text x="170" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#9d174d">4. INVESTISSEMENT</text>
  <text x="170" y="338" text-anchor="middle" font-size="24" dy="-20" fill="#ec4899">💎</text>
  <text x="170" y="360" text-anchor="middle" font-size="11" fill="#db2777">Engagement</text>
  <text x="170" y="378" text-anchor="middle" font-size="10" fill="#ec4899">Données, contenu, réputation</text>
  <text x="170" y="394" text-anchor="middle" font-size="9" fill="#f472b6">Charge le prochain trigger</text>

  <!-- Arrows connecting the boxes -->
  <!-- Trigger → Action -->
  <line x1="265" y1="140" x2="435" y2="140" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Action → Reward -->
  <line x1="530" y1="195" x2="530" y2="305" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Reward → Investment -->
  <line x1="435" y1="360" x2="265" y2="360" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Investment → Trigger -->
  <line x1="170" y1="305" x2="170" y2="195" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Source -->
  <text x="350" y="480" text-anchor="middle" font-size="10" fill="#94a3b8">Source : KB-05 Design comportemental — Nir Eyal, Hooked (2014)</text>
</svg>