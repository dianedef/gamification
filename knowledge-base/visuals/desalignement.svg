<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="gaparrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Le désalignement silencieux</text>
  <text x="400" y="50" text-anchor="middle" font-size="13" fill="#64748b">Loi de Goodhart : quand une mesure devient un objectif, elle cesse d'être une bonne mesure</text>

  <!-- Left column header -->
  <rect x="40" y="75" width="300" height="35" rx="8" fill="#ecfdf5"/>
  <text x="190" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">Ce que l'utilisateur veut</text>

  <!-- Right column header -->
  <rect x="460" y="75" width="300" height="35" rx="8" fill="#fef2f2"/>
  <text x="610" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">Ce que la gamification mesure</text>

  <!-- Gap label -->
  <text x="400" y="98" text-anchor="middle" font-size="11" font-weight="600" fill="#ef4444">GAP</text>

  <!-- Row 1 -->
  <rect x="40" y="125" width="300" height="40" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="190" y="150" text-anchor="middle" font-size="12" fill="#166534">Parler espagnol en voyage</text>
  <line x1="345" y1="145" x2="455" y2="145" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#gaparrow)"/>
  <rect x="460" y="125" width="300" height="40" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
  <text x="610" y="150" text-anchor="middle" font-size="12" fill="#991b1b">Streak quotidien de 5 min</text>

  <!-- Row 2 -->
  <rect x="40" y="175" width="300" height="40" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="190" y="200" text-anchor="middle" font-size="12" fill="#166534">Être en meilleure santé</text>
  <line x1="345" y1="195" x2="455" y2="195" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#gaparrow)"/>
  <rect x="460" y="175" width="300" height="40" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
  <text x="610" y="200" text-anchor="middle" font-size="12" fill="#991b1b">Nombre de pas par jour</text>

  <!-- Row 3 -->
  <rect x="40" y="225" width="300" height="40" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="190" y="250" text-anchor="middle" font-size="12" fill="#166534">Progresser dans sa carrière</text>
  <line x1="345" y1="245" x2="455" y2="245" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#gaparrow)"/>
  <rect x="460" y="225" width="300" height="40" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
  <text x="610" y="250" text-anchor="middle" font-size="12" fill="#991b1b">Articles lus et badges collectés</text>

  <!-- Row 4 -->
  <rect x="40" y="275" width="300" height="40" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="190" y="300" text-anchor="middle" font-size="12" fill="#166534">Se sentir moins seul</text>
  <line x1="345" y1="295" x2="455" y2="295" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#gaparrow)"/>
  <rect x="460" y="275" width="300" height="40" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
  <text x="610" y="300" text-anchor="middle" font-size="12" fill="#991b1b">Points de contribution au forum</text>

  <!-- Row 5 -->
  <rect x="40" y="325" width="300" height="40" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="190" y="350" text-anchor="middle" font-size="12" fill="#166534">Arrêter la cocaïne</text>
  <line x1="345" y1="345" x2="455" y2="345" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#gaparrow)"/>
  <rect x="460" y="325" width="300" height="40" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
  <text x="610" y="350" text-anchor="middle" font-size="12" fill="#991b1b">Articles lus dans l'app</text>

  <!-- Source -->
  <text x="400" y="393" text-anchor="middle" font-size="10" fill="#94a3b8">Source : KB-18 L'alignement de purpose — Charles Goodhart (1975)</text>
</svg>