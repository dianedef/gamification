<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Les 3 niveaux d'alignement</text>
  <text x="400" y="55" text-anchor="middle" font-size="13" fill="#64748b">Est-ce que la gamification sert vraiment l'utilisateur ?</text>

  <!-- Pyramid - Level 3 (top) -->
  <polygon points="400,80 540,200 260,200" fill="#7c3aed" filter="url(#shadow)"/>
  <text x="400" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">EXISTENTIEL</text>
  <text x="400" y="163" text-anchor="middle" font-size="11" fill="#ddd6fe">« Est-ce que ça sert sa vie ? »</text>

  <!-- Pyramid - Level 2 (middle) -->
  <polygon points="260,205 540,205 610,325 190,325" fill="#8b5cf6" filter="url(#shadow)"/>
  <text x="400" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">MOTIVATIONNEL</text>
  <text x="400" y="278" text-anchor="middle" font-size="11" fill="#ddd6fe">« Est-ce que ça motive pour les bonnes raisons ? »</text>

  <!-- Pyramid - Level 1 (base) -->
  <polygon points="190,330 610,330 680,450 120,450" fill="#a78bfa" filter="url(#shadow)"/>
  <text x="400" y="385" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">FONCTIONNEL</text>
  <text x="400" y="403" text-anchor="middle" font-size="11" fill="#ede9fe">« Est-ce que ça aide ? »</text>

  <!-- Right side annotations -->
  <!-- Level 3 -->
  <line x1="545" y1="150" x2="600" y2="150" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="605" y="118" width="175" height="65" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="692" y="138" text-anchor="middle" font-size="11" font-weight="600" fill="#7c3aed">Objectif de vie</text>
  <text x="692" y="154" text-anchor="middle" font-size="10" fill="#6d28d9">Identité en construction</text>
  <text x="692" y="170" text-anchor="middle" font-size="10" fill="#6d28d9">Sens et purpose</text>

  <!-- Level 2 -->
  <line x1="580" y1="270" x2="600" y2="270" stroke="#8b5cf6" stroke-width="1.5"/>
  <rect x="605" y="238" width="175" height="65" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1"/>
  <text x="692" y="258" text-anchor="middle" font-size="11" font-weight="600" fill="#8b5cf6">Autonomie (SDT)</text>
  <text x="692" y="274" text-anchor="middle" font-size="10" fill="#7c3aed">Compétence réelle</text>
  <text x="692" y="290" text-anchor="middle" font-size="10" fill="#7c3aed">Relation authentique</text>

  <!-- Level 1 -->
  <line x1="640" y1="395" x2="660" y2="395" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="605" y="363" width="175" height="65" rx="6" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1"/>
  <text x="692" y="383" text-anchor="middle" font-size="11" font-weight="600" fill="#a78bfa">Mesure le bon proxy</text>
  <text x="692" y="399" text-anchor="middle" font-size="10" fill="#8b5cf6">Rythme adapté</text>
  <text x="692" y="415" text-anchor="middle" font-size="10" fill="#8b5cf6">Feedback informatif</text>

  <!-- Left side: aligned vs misaligned -->
  <rect x="20" y="180" width="145" height="100" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="92" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">✅ Aligné</text>
  <text x="92" y="218" text-anchor="middle" font-size="10" fill="#15803d">Accélérateur</text>
  <text x="92" y="234" text-anchor="middle" font-size="10" fill="#15803d">de valeur réelle</text>
  <text x="92" y="256" text-anchor="middle" font-size="9" fill="#166534">Duolingo, GitHub,</text>
  <text x="92" y="270" text-anchor="middle" font-size="9" fill="#166534">Strava sans gamification</text>

  <rect x="20" y="300" width="145" height="100" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
  <text x="92" y="320" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">❌ Désaligné</text>
  <text x="92" y="338" text-anchor="middle" font-size="10" fill="#b91c1c">Substitut</text>
  <text x="92" y="354" text-anchor="middle" font-size="10" fill="#b91c1c">de valeur absente</text>
  <text x="92" y="376" text-anchor="middle" font-size="9" fill="#991b1b">Jeux vides, streaks qui</text>
  <text x="92" y="390" text-anchor="middle" font-size="9" fill="#991b1b">mesurent le mauvais proxy</text>

  <!-- Arrow up -->
  <line x1="20" y1="460" x2="20" y2="80" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#cbd5e1"/>
    </marker>
  </defs>
  <text x="12" y="275" text-anchor="middle" font-size="10" fill="#94a3b8" transform="rotate(-90, 12, 275)">Profondeur d'impact</text>

  <!-- Source -->
  <text x="400" y="508" text-anchor="middle" font-size="10" fill="#94a3b8">Source : KB-18 L'alignement de purpose</text>
</svg>