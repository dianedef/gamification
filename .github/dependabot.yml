version: 2
# Mensuel + groupe : 1 PR par ecosysteme et par mois (les alertes securite restent immediates).
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/site"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      npm_all:
        patterns:
          - "*"
